<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIQLO PLUS - Control Panel</title>
<style>
:root{--red:#ec1c24;--ink:#16191d;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--card:#fff;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--blue:#1d4ed8;--side:#111418;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0d1213,#1d2429)}
.login-card{background:#fff;width:min(380px,92vw);padding:32px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.logo{width:34px;height:34px;background:var(--red);color:#fff;display:grid;place-items:center;border-radius:6px;font-weight:900;font-size:13px}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:#cbd2d9;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{color:#fff;padding:4px 8px 18px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
nav button:hover{background:#1c2127}
nav button.on{background:var(--red);color:#fff}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b7580;margin:16px 12px 6px}
main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0}
.who{display:flex;align-items:center;gap:10px;color:var(--mut)}
.content{padding:24px;max-width:1300px}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .n{font-size:28px;font-weight:800}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.two{grid-template-columns:2fr 1fr}.cols2{grid-template-columns:1fr 1fr}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:static;height:auto}.two,.cols2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:#c8151c}
.btn.dng{color:var(--err);border-color:#f3c9c9}.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input,select,textarea{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.bar input,.bar select{width:auto;min-width:150px}
input:focus,select:focus,textarea:focus{outline:2px solid #fca5a5;border-color:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:#fafafa;white-space:nowrap}
tr:hover td{background:#fcfcfd}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.thumb{width:40px;height:52px;object-fit:cover;border-radius:4px;background:#eee}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3}
.tag.ok{background:#dcfce7;color:var(--ok)}.tag.warn{background:#fef3c7;color:var(--warn)}.tag.err{background:#fee2e2;color:var(--err)}.tag.gr{background:#e5e7eb;color:#374151}
.mut{color:var(--mut)}.right{text-align:right}.nowrap{white-space:nowrap}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,18,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.sm{width:min(440px,100%)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:16px}
.modal .bd{padding:18px 20px;overflow:auto}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form .full{grid-column:1/-1}
.form label{display:block;font-weight:600;font-size:12px;margin-bottom:4px;color:#374151}
.form .hint{font-size:11px;color:var(--mut);margin-top:3px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.crow{display:grid;grid-template-columns:70px 1fr 52px 1.6fr 30px;gap:6px;margin-bottom:6px}
.crow input[type=color]{padding:2px;height:36px}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:99}
.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;max-height:380px;white-space:pre-wrap}
.bars .row{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.bars .b{height:10px;background:#fecaca;border-radius:6px;overflow:hidden}.bars .b i{display:block;height:100%;background:var(--red)}
.note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;padding:10px 14px;border-radius:8px;font-size:13px}
.note.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.err-box{color:var(--err);font-size:13px;min-height:18px;margin:8px 0}
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand"><span class="logo">UQ</span><span>UNIQLO PLUS &middot; Control Panel</span></div>
    <p class="mut" style="margin:14px 0 18px">Masuk dengan akun administrator.</p>
    <label for="lu" style="font-weight:600;font-size:12px">Username</label>
    <input id="lu" autocomplete="username" required autofocus>
    <label for="lp" style="font-weight:600;font-size:12px;display:block;margin-top:12px">Password</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <div class="err-box" id="lerr"></div>
    <button class="btn pri" style="width:100%" id="lbtn">Masuk</button>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><span class="logo">UQ</span><span>PLUS Admin</span></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top"><h1 id="title"></h1>
      <div class="who"><span id="who"></span><button class="btn sm" id="pwBtn">Ganti password</button><button class="btn sm" id="outBtn">Keluar</button></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="toasts"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>n==null||n===''?'-':'Rp '+Math.round(+n).toLocaleString('id-ID');
const dt=t=>{if(t===null||t===undefined||t==='')return '-';const numeric=typeof t==='number'||/^\\d+(\\.\\d+)?$/.test(String(t));const d=numeric?new Date(Number(t)*1000):new Date(String(t));return Number.isNaN(d.getTime())?'Tanggal tidak valid':d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});};
let TOKEN=sessionStorage.getItem('uplus_admin')||'', ME=null;

async function api(method,path,body){
  const r=await fetch('/admin/api'+path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body===undefined?undefined:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=='/login'){logout(true);throw new Error(j.error||'Sesi berakhir')}
  if(!r.ok)throw new Error(j.error||('Error '+r.status));
  return j;
}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),4200)}
const can=role=>({admin:1,owner:2}[ME.role]>={admin:1,owner:2}[role]);

/* ---------- modal helpers ---------- */
function modal({title,body,actions=[],small=false,onclose}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal ${small?'sm':''}" role="dialog" aria-modal="true"><header><h3>${esc(title)}</h3><button class="btn sm" data-x>&times;</button></header><div class="bd"></div><footer></footer></div>`;
  const bd=$('.bd',ov);typeof body==='string'?bd.innerHTML=body:bd.append(body);
  const close=()=>{ov.remove();onclose&&onclose()};
  $('[data-x]',ov).onclick=close;ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  const ft=$('footer',ov);
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=async()=>{b.disabled=true;try{const r=await a.run(ov);if(r!==false)close()}catch(e){toast(e.message,'err')}finally{b.disabled=false}};ft.append(b)});
  if(!actions.length)ft.remove();
  document.body.append(ov);return {ov,close};
}
function confirmBox(msg,label='Hapus',cls='dng'){return new Promise(res=>{let done=false;const m=modal({title:'Konfirmasi',small:true,body:`<p>${esc(msg)}</p>`,onclose:()=>{if(!done)res(false)},actions:[{label:'Batal',run:()=>{}},{label,cls,run:()=>{done=true;res(true)}}]})})}

/* ---------- form builder ---------- */
function fieldHtml(f,v){
  const id='f_'+f.name,val=v??f.def??'';
  let inp;
  if(f.type==='textarea')inp=`<textarea id="${id}" rows="${f.rows||3}">${esc(Array.isArray(val)?val.join('\n'):val)}</textarea>`;
  else if(f.type==='select')inp=`<select id="${id}">${f.options.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.type==='check')return `<div class="${f.full?'full':''}"><label class="chk"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label></div>`;
  else inp=`<input id="${id}" type="${f.type||'text'}" value="${esc(val)}" ${f.ro?'readonly':''} ${f.step?`step="${f.step}"`:''}>`;
  return `<div class="${f.full?'full':''}"><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function readForm(root,fields){
  const o={};
  for(const f of fields){const el=$('#f_'+f.name,root);if(!el)continue;
    if(f.type==='check')o[f.name]=el.checked;else if(f.type==='number')o[f.name]=el.value===''?null:+el.value;else o[f.name]=el.value}
  return o;
}
function formModal({title,fields,values={},submit,extra}){
  const body=document.createElement('div');
  body.innerHTML=`<div class="form">${fields.map(f=>fieldHtml(f,values[f.name])).join('')}</div>${extra?'<div id="extra"></div>':''}`;
  if(extra)extra(body);
  return modal({title,body,actions:[{label:'Batal',run:()=>{}},{label:'Simpan',cls:'pri',run:async ov=>{await submit(readForm(ov,fields),ov)}}]});
}

/* ---------- generic list (tabel + cari + halaman) ---------- */
function listView(el,{path,cols,filters=[],search=true,perPage=20,actions,toolbar,empty='Belum ada data.',paged=true,pre}){
  const st={page:1,q:'',f:{}};
  el.innerHTML=`<div class="bar"></div><div class="tw"><table><thead></thead><tbody></tbody></table></div><div class="pager"></div>`;
  const bar=$('.bar',el),tb=$('tbody',el),pg=$('.pager',el);
  $('thead',el).innerHTML='<tr>'+cols.map(c=>`<th class="${c.cls||''}">${esc(c.label)}</th>`).join('')+(actions?'<th></th>':'')+'</tr>';
  if(search){const i=document.createElement('input');i.placeholder='Cari...';let t;i.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{st.q=i.value;st.page=1;load()},300)};bar.append(i)}
  filters.forEach(f=>{const s=document.createElement('select');s.dataset.k=f.key;s.onchange=()=>{st.f[f.key]=s.value;st.page=1;load()};s.innerHTML=`<option value="">${esc(f.label)}</option>`+(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('');bar.append(s)});
  const sp=document.createElement('span');sp.className='sp';bar.append(sp);
  toolbar&&toolbar(bar,load);
  let data=null;
  async function load(){
    const qs=new URLSearchParams({page:st.page,per_page:perPage});
    if(st.q)qs.set('q',st.q);Object.entries(st.f).forEach(([k,v])=>v&&qs.set(k,v));
    try{data=await api('GET',path+(path.includes('?')?'&':'?')+qs)}catch(e){tb.innerHTML=`<tr><td colspan="9" class="empty">${esc(e.message)}</td></tr>`;return}
    const items=data.items;
    filters.forEach(f=>{if(f.from&&data[f.from]){const s=$(`select[data-k="${f.key}"]`,bar);if(s&&s.options.length===1){data[f.from].forEach(o=>s.append(new Option(o,o)))}}});
    tb.innerHTML=items.length?'':`<tr><td colspan="${cols.length+1}" class="empty">${esc(empty)}</td></tr>`;
    items.forEach(it=>{const tr=document.createElement('tr');tr.innerHTML=cols.map(c=>`<td class="${c.cls||''}">${c.render?c.render(it):esc(it[c.key])}</td>`).join('')+(actions?'<td class="right nowrap"></td>':'');
      if(actions){const td=tr.lastElementChild;actions(it,load).forEach(a=>{if(a.show===false)return;const b=document.createElement('button');b.className='btn sm '+(a.cls||'');b.textContent=a.label;b.style.marginLeft='6px';b.onclick=()=>a.run();td.append(b)})}
      tb.append(tr)});
    const pages=Math.max(1,Math.ceil(data.total/data.per_page));
    pg.innerHTML=paged?`<span>${data.total} data &middot; halaman ${data.page}/${pages}</span>`:'';
    if(paged){const p=document.createElement('button'),n=document.createElement('button');p.className=n.className='btn sm';p.textContent='‹ Sebelumnya';n.textContent='Berikutnya ›';p.disabled=st.page<=1;n.disabled=st.page>=pages;p.onclick=()=>{st.page--;load()};n.onclick=()=>{st.page++;load()};pg.append(p,n)}
  }
  load();return load;
}
/* daftar sederhana (tanpa paging server): data = {items:[]} */
function simpleList(el,{path,cols,actions,toolbar,empty}){
  el.innerHTML=`<div class="bar"></div><div class="tw"><table><thead></thead><tbody></tbody></table></div>`;
  const bar=$('.bar',el),tb=$('tbody',el);
  $('thead',el).innerHTML='<tr>'+cols.map(c=>`<th>${esc(c.label)}</th>`).join('')+(actions?'<th></th>':'')+'</tr>';
  const sp=document.createElement('span');sp.className='sp';bar.append(sp);
  async function load(){
    let d;try{d=await api('GET',path)}catch(e){tb.innerHTML=`<tr><td colspan="9" class="empty">${esc(e.message)}</td></tr>`;return}
    tb.innerHTML=d.items.length?'':`<tr><td colspan="${cols.length+1}" class="empty">${esc(empty||'Belum ada data.')}</td></tr>`;
    d.items.forEach(it=>{const tr=document.createElement('tr');tr.innerHTML=cols.map(c=>`<td>${c.render?c.render(it):esc(it[c.key])}</td>`).join('')+(actions?'<td class="right nowrap"></td>':'');
      if(actions){const td=tr.lastElementChild;actions(it,load).forEach(a=>{if(a.show===false)return;const b=document.createElement('button');b.className='btn sm '+(a.cls||'');b.textContent=a.label;b.style.marginLeft='6px';b.onclick=()=>a.run();td.append(b)})}
      tb.append(tr)});
  }
  toolbar&&toolbar(bar,load);load();return load;
}

/* ================= HALAMAN ================= */
const PAGES={};

/* ---- dashboard ---- */
PAGES.dashboard={title:'Dashboard',async render(v){
  const d=await api('GET','/dashboard'),c=d.counts;
  const kp=(n,l)=>`<div class="card kpi"><div class="n">${(+n).toLocaleString('id-ID')}</div><div class="l">${l}</div></div>`;
  const max=Math.max(1,...d.series.map(s=>Math.max(s.feedback,s.users)));
  const W=640,H=170,bw=W/d.series.length;
  const bars=d.series.map((s,i)=>{const h1=s.feedback/max*(H-30),h2=s.users/max*(H-30);return `<rect x="${i*bw+6}" y="${H-20-h1}" width="${bw/2-8}" height="${h1}" fill="#ec1c24" rx="2"><title>${s.date}: ${s.feedback} umpan balik</title></rect><rect x="${i*bw+bw/2-1}" y="${H-20-h2}" width="${bw/2-8}" height="${h2}" fill="#1d4ed8" rx="2"><title>${s.date}: ${s.users} user baru</title></rect><text x="${i*bw+bw/2}" y="${H-5}" font-size="9" text-anchor="middle" fill="#6b7280">${s.date}</text>`}).join('');
  const bars2=(arr,k,lab)=>{const m=Math.max(1,...arr.map(x=>x[k]));return arr.map(x=>`<div class="row"><span title="${esc(x[lab])}">${esc(String(x[lab]).slice(0,18))}</span><span class="b"><i style="width:${x[k]/m*100}%"></i></span><b>${x[k]}</b></div>`).join('')||'<div class="mut">Belum ada data.</div>'};
  const m=d.model;
  const ml=m?`<p><b>Versi ${esc(m.version)}</b> <span class="tag gr">${esc(m.origin)}</span></p>`+Object.entries(m.sources).map(([k,s])=>`<div class="nowrap">${esc(k)} <span class="tag ${s.startsWith('trained:real')?'ok':s.startsWith('trained')?'warn':'gr'}">${esc(s)}</span></div>`).join(''):`<p class="mut">Memakai model bawaan aplikasi (assets/data/ml_model.json). Unggah atau latih model di menu Model ML.</p>`;
  v.innerHTML=`<div class="grid kpis">${kp(c.products,'Produk')}${kp(c.users,'Member')}${kp(c.users_7d,'Member baru 7 hari')}${kp(c.profiles,'Profil gaya')}${kp(c.feedback,'Umpan balik')}${kp(c.vouchers,'Voucher aktif')}${kp(c.news,'Berita tayang')}${kp(c.stores,'Toko (server)')}</div>
  <div class="grid kpis" style="margin-top:12px">${kp(c.orders,'Pesanan')}${kp(c.order_items,'Item pesanan')}${kp(c.addresses,'Alamat')}${kp(c.cart_items,'Keranjang')}${kp(c.wishlist,'Wishlist')}${kp(c.activities,'Aktivitas member')}${kp(c.points,'Transaksi poin')}${kp(c.reviews,'Ulasan produk')}</div>
  <div class="grid two" style="margin-top:16px"><div class="card"><b>Aktivitas 14 hari</b> <span class="mut" style="font-size:12px"><span style="color:#ec1c24">&#9632;</span> umpan balik <span style="color:#1d4ed8">&#9632;</span> member baru</span><svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px">${bars}</svg></div>
  <div class="card"><b>Model ML aktif</b><div style="margin-top:8px">${ml}</div></div></div>
  <div class="grid cols2" style="margin-top:16px"><div class="card bars"><b>Produk paling diminati</b>${bars2(d.top_products.map(p=>({...p,score:Math.round(p.score*10)/10})),'score','name')}</div>
  <div class="card bars"><b>Produk per kategori</b>${bars2(d.categories,'n','label')}</div></div>
  <div class="card bars" style="margin-top:16px"><b>Profil kulit pengguna (undertone/kedalaman)</b>${bars2(Object.entries(d.profiles_by_skin).map(([k,n])=>({k,n})),'n','k')}</div>`;
}};

/* ---- produk ---- */
const argbHex=a=>'#'+((a>>>0)&0xffffff).toString(16).padStart(6,'0');
const hexArgb=h=>(0xff000000|parseInt(h.slice(1),16))>>>0;
PAGES.products={title:'Produk',render(v){
  const base=[{name:'id',label:'ID produk',req:true},{name:'name',label:'Nama',req:true},{name:'price',label:'Harga (Rp)',type:'number',req:true},{name:'original_price',label:'Harga normal / coret (Rp)',type:'number',hint:'Kosongkan bila tidak diskon'},
    {name:'category',label:'Kategori',req:true},{name:'audience',label:'Target (Men/Women/Unisex/Kids/Baby)',req:true},{name:'image',label:'URL foto utama',full:true},
    {name:'description',label:'Deskripsi',type:'textarea',full:true},{name:'sizes',label:'Ukuran (pisah koma)',full:true},{name:'features',label:'Label teknologi (AIRism, HEATTECH, ...)'},{name:'url',label:'URL halaman produk'},
    {name:'rating_average',label:'Rating',type:'number',step:'0.1'},{name:'rating_count',label:'Jumlah ulasan',type:'number'},{name:'gallery',label:'Galeri foto (satu URL per baris)',type:'textarea',full:true},{name:'is_new',label:'Tandai BARU',type:'check'}];
  const open=(p,reload)=>{
    const isNew=!p;const vals=p?{...p,sizes:p.sizes.join(', '),features:p.features.join(', '),gallery:p.gallery}:{audience:'Unisex',price:0};
    const rows=(p?p.colors.map((c,i)=>({code:p.color_codes[i],name:p.color_names[i],hex:argbHex(c),img:p.color_images[i]})):[]);
    const fields=isNew?base:base.map(f=>f.name==='id'?{...f,ro:true}:f);

    simpleList(v,{path,cols,empty:`Belum ada ${label}.`,
      toolbar:(bar,reload)=>{if(!can('admin'))return;const a=document.createElement('button');a.className='btn pri';a.textContent='+ '+label;a.onclick=()=>open(null,reload);bar.append(a);

/* ---- model ML ---- */
PAGES.ml={title:'Model Machine Learning',async render(v){
  const st=await api('GET','/ml/status');
  v.innerHTML=`<div class="grid cols2"><div class="card"><b>Status pelatihan</b><p>Python & library: ${st.python_deps_ok?'<span class="tag ok">siap</span>':'<span class="tag err">belum (pip install -r ml/requirements.txt)</span>'}</p><p>Baris umpan balik yang bisa dilatih: <b>${st.trainable_feedback_rows}</b></p>
  <p class="mut" style="font-size:12px">Dataset di <code>ml/data/raw/</code>: ${st.raw_files.length?st.raw_files.map(f=>`<span class="tag gr">${esc(f.name)}${f.dir?'/':''}</span>`).join(' '):'<i>kosong - lihat ml/DATASETS.md untuk dataset Kaggle yang dipakai</i>'}</p>
  <div class="bar" style="margin-bottom:0">${can('owner')?'<button class="btn pri" id="trainBtn">Latih ulang model</button>':''}${can('admin')?'<button class="btn" id="upBtn">Unggah model.json</button>':''}${can('admin')?'<button class="btn" id="deBtn">Pakai model bawaan</button>':''}</div></div>
  <div class="card note info" style="border-radius:10px"><b>Cara membaca sumber model</b><br><span class="tag gr">prior:theory</span> aturan teori, belum dilatih<br><span class="tag warn">trained:synthetic</span> dilatih dari simulasi pengguna (bootstrap)<br><span class="tag ok">trained:real</span> dilatih dari dataset/foto nyata<br><span class="mut">+feedback = ikut memakai umpan balik pengguna aplikasi.</span></div></div>
  <h3 style="margin:22px 0 10px">Versi model</h3><div id="mlist"></div>`;
  const list=simpleList($('#mlist',v),{path:'/ml/models',empty:'Belum ada model di server. Aplikasi memakai model bawaan.',
    cols:[{label:'#',key:'id'},{label:'Versi',render:m=>`<b>${esc(m.version)}</b>`},{label:'Asal',render:m=>`<span class="tag gr">${esc(m.origin)}</span>`},{label:'Dibuat',render:m=>dt(m.created_at)},
     {label:'Komponen',render:m=>Object.entries(m.sources).map(([k,s])=>`<div class="nowrap" style="font-size:12px">${esc(k)} <span class="tag ${s.startsWith('trained:real')?'ok':s.startsWith('trained')?'warn':'gr'}">${esc(s)}</span></div>`).join('')},
     {label:'Data',render:m=>m.datasets.map(d=>`<div style="font-size:12px">${esc(d.name)} <span class="mut">(${d.kind}, ${d.rows} baris)</span></div>`).join('')},{label:'Status',render:m=>m.active?'<span class="tag ok">AKTIF</span>':''}],
    actions:(m,reload)=>[{label:'Bukti & metrik',run:()=>showModel(m.id)},{label:'Aktifkan',show:can('admin')&&!m.active,run:async()=>{await api('POST','/ml/models/'+m.id+'/activate');toast('Model diaktifkan. Aplikasi mengunduhnya saat sinkron.','ok');reload()}},{label:'Hapus',cls:'dng',show:can('admin')&&!m.active,run:async()=>{if(await confirmBox('Hapus versi model ini?')){await api('DELETE','/ml/models/'+m.id);reload()}}}]});
  const showModel=async id=>{const d=await api('GET','/ml/models/'+id);const m=d.model;
    modal({title:'Model '+m.version,body:`<h4>Bukti data</h4><div class="tw"><table><tr><th>Dataset</th><th>Jenis</th><th>Baris</th><th>SHA-256</th><th>Dipakai untuk</th></tr>${m.datasets.map(x=>`<tr><td>${esc(x.name)}${x.url?`<div style="font-size:11px"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></div>`:''}</td><td><span class="tag ${x.kind==='real'?'ok':'warn'}">${esc(x.kind)}</span></td><td>${esc(x.rows)}</td><td style="font-size:11px">${esc((x.sha256||'-').slice(0,16))}</td><td>${esc((x.used_for||[]).join(', '))}</td></tr>`).join('')}</table></div>
    <h4>Metrik</h4><pre>${esc(JSON.stringify(m.metrics,null,1))}</pre><h4>Laporan pelatihan</h4><pre>${esc(d.report||'(tidak ada)')}</pre>`})};
  const tb=$('#trainBtn',v);if(tb)tb.onclick=()=>{
    const opt=(k,dir)=>[['','(tidak dipakai)'],...st.raw_files.filter(f=>f.dir===dir).map(f=>[f.name,f.name])];
    formModal({title:'Latih ulang model',fields:[{name:'use_feedback',label:'Pakai umpan balik pengguna nyata dari database',type:'check',def:true,full:true},
      {name:'styles',label:'styles.csv (Kaggle Fashion Product Images)',type:'select',options:opt('styles',false)},{name:'faces',label:'Folder foto bentuk wajah',type:'select',options:opt('faces',true)},
      {name:'skin_csv',label:'CSV foto berlabel Monk Skin Tone',type:'select',options:opt('skin',false)},{name:'pairs',label:'CSV pasangan warna outfit',type:'select',options:opt('pairs',false)},
      {name:'note',label:'Catatan',full:true},{name:'activate',label:'Langsung aktifkan setelah selesai',type:'check',full:true}],
      values:{use_feedback:true},submit:async(o,ov)=>{toast('Pelatihan berjalan, mohon tunggu...');const r=await api('POST','/ml/train',o);toast('Selesai: '+r.version,'ok');list();}});};
  const ub=$('#upBtn',v);if(ub)ub.onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const model=JSON.parse(await f.files[0].text());
    formModal({title:'Unggah model '+(model.version||''),fields:[{name:'note',label:'Catatan',full:true},{name:'activate',label:'Langsung aktifkan',type:'check',full:true}],submit:async o=>{await api('POST','/ml/models',{model,note:o.note,activate:o.activate});toast('Model diunggah','ok');list()}})}catch(e){toast('Berkas bukan JSON valid','err')}};f.click()};
  const de=$('#deBtn',v);if(de)de.onclick=async()=>{if(await confirmBox('Nonaktifkan semua model di server? Aplikasi kembali memakai model bawaan (assets/data/ml_model.json).','Ya, nonaktifkan','pri')){await api('POST','/ml/models/deactivate');list()}};
}};

/* ================= SHELL ================= */
const MENU=[['dashboard','Dashboard',''],['products','Produk','Konten'],['variants','Varian Produk',''],['news','Berita & Promo',''],['vouchers','Voucher',''],['stores','Toko',''],['users','Pengguna / Member','Pelanggan'],['addresses','Alamat Pelanggan',''],['orders','Pesanan',''],['orderItems','Item Pesanan',''],['cart','Keranjang',''],['wishlist','Wishlist',''],['activities','Aktivitas Member',''],['points','Riwayat Poin',''],['profiles','Profil Gaya',''],['reviews','Ulasan Produk',''],['feedback','Umpan Balik Produk',''],['ml','Model ML','Machine Learning'],['audit','Log Audit','Sistem'],['admins','Admin & Akses','']];
function buildNav(){const n=$('#nav');n.innerHTML='';MENU.forEach(([k,l,g])=>{if(k==='admins'&&ME.role!=='owner')return;if(g){const d=document.createElement('div');d.className='grp';d.textContent=g;n.append(d)}const b=document.createElement('button');b.dataset.k=k;b.textContent=l;b.onclick=()=>go(k);n.append(b)})}
async function go(k){
  if(!PAGES[k])k='dashboard';location.hash=k;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('#title').textContent=PAGES[k].title;const v=$('#view');v.innerHTML='<div class="empty">Memuat...</div>';
  try{v.innerHTML='';await PAGES[k].render(v)}catch(e){v.innerHTML=`<div class="note">${esc(e.message)}</div>`}
}
/* Real-time SSE Connection */
let sseSource = null;
function initRealtimeAdmin(){
  if (sseSource) return;
  try {
    sseSource = new EventSource('/admin/events');
    sseSource.addEventListener('connected', () => console.log('SSE connected'));
    sseSource.addEventListener('new_user', (e) => {
      const d = JSON.parse(e.data);
      toast(`🎉 User baru mendaftar: ${d.name || d.email}`, 'ok');
      const cur = location.hash.slice(1) || 'dashboard';
      if (cur === 'users' || cur === 'dashboard') go(cur);
    });
    sseSource.addEventListener('new_order', (e) => {
      const d = JSON.parse(e.data);
      toast(`🛒 Pesanan Baru #${d.id} (Rp ${(+d.total||0).toLocaleString('id-ID')})`, 'ok');
      const cur = location.hash.slice(1) || 'dashboard';
      if (cur === 'orders' || cur === 'dashboard') go(cur);
    });
    sseSource.addEventListener('order_updated', (e) => {
      const d = JSON.parse(e.data);
      toast(`📦 Status Pesanan #${d.id}: ${d.status}`, 'ok');
      const cur = location.hash.slice(1) || 'dashboard';
      if (cur === 'orders' || cur === 'dashboard') go(cur);
    });
    sseSource.onerror = () => {
      if (sseSource) { sseSource.close(); sseSource = null; }
      setTimeout(initRealtimeAdmin, 5000);
    };
  } catch(e){ console.error('SSE Error:', e); }
}
function stopRealtimeAdmin(){
  if (sseSource) { sseSource.close(); sseSource = null; }
}

function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=ME.name+' ('+ME.role+')';buildNav();go(location.hash.slice(1)||'dashboard');initRealtimeAdmin();}
function logout(silent){stopRealtimeAdmin();TOKEN='';ME=null;sessionStorage.removeItem('uplus_admin');if(!silent)api('POST','/logout').catch(()=>{});$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#outBtn').onclick=async()=>{try{await api('POST','/logout')}catch(e){}logout(true)};
$('#pwBtn').onclick=()=>formModal({title:'Ganti password',fields:[{name:'old_password',label:'Password lama',type:'password',full:true},{name:'new_password',label:'Password baru (min. 8)',type:'password',full:true}],submit:async o=>{await api('PUT','/me',o);toast('Password diganti','ok')}});
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';$('#lbtn').disabled=true;
  try{const r=await api('POST','/login',{username:$('#lu').value,password:$('#lp').value});TOKEN=r.token;ME=r.admin;sessionStorage.setItem('uplus_admin',TOKEN);$('#lp').value='';showApp()}
  catch(err){$('#lerr').textContent=err.message}finally{$('#lbtn').disabled=false}};
window.addEventListener('hashchange',()=>{if(ME)go(location.hash.slice(1))});
(async()=>{if(TOKEN){try{ME=(await api('GET','/me')).admin;showApp()}catch(e){logout(true)}}})();
</script>
